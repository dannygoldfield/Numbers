[package]
name = "numbers-prototype-01"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4"
fs2 = "0.4"
hex = "0.4"
num-bigint = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
tiny_http = "0.12"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
overflow-checks = true
